<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给你的小票</title>
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; overflow: hidden; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdfaf5;
    color: #2b2b2b;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .song{ font-family: "Songti SC", "SimSun", "宋体", "Noto Serif SC", serif; }

  /* ---------- 页面基础 ---------- */
  .page{
    position: fixed; inset: 0;
    opacity: 0; pointer-events: none;
    transition: opacity .75s ease;
    overflow: hidden;
  }
  .page.active{ opacity: 1; pointer-events: auto; }

  .full-canvas{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(16px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes pop{
    0%{ opacity: 0; transform: rotate(-2deg) scale(.86); }
    100%{ opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  /* ---------- 通用按钮 ---------- */
  .btn{
    font-family: inherit;
    border: none; cursor: pointer;
    padding: 12px 30px;
    border-radius: 999px;
    background: #fff; color: #1a2b33;
    font-size: 14px; letter-spacing: .14em;
    box-shadow: 0 8px 22px rgba(0,0,0,.16);
    transition: transform .25s ease, box-shadow .25s ease, background .25s;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.22); }
  .btn:active{ transform: translateY(0) scale(.96); }

  /* ================= 第一页 · 电影票 ================= */
  #p1{
    display: flex; align-items: center; justify-content: center;
    background: #faf6ef;
  }
  #p1::before{
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,0,0,.045) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .8;
  }

  .ticket{
    position: relative;
    display: flex;
    width: min(88vw, 360px);
    height: 186px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 18px 40px rgba(80,60,30,.13), 0 2px 6px rgba(80,60,30,.06);
    transform: rotate(-2deg);
  }
  #p1.active .ticket{ animation: pop .85s cubic-bezier(.2,.9,.3,1) both; }

  .ticket-body{
    flex: 1;
    padding: 22px 18px 18px 24px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .t-top{
    font-size: 9px; letter-spacing: .32em;
    color: #c9bfae; margin-bottom: 14px;
  }
  .t-title{
    font-size: 27px; letter-spacing: .16em;
    color: #2b2b2b; margin-bottom: 14px;
  }
  .t-line{
    font-size: 10.5px; letter-spacing: .1em;
    color: #9a9184; line-height: 1.9;
  }
  .t-seat{
    margin-top: auto;
    font-size: 11px; letter-spacing: .18em;
    color: #d1896b;
  }

  .ticket-stub{
    position: relative;
    width: 80px;
    flex: 0 0 80px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border-left: 2px dashed #ece5d9;
    border-radius: 0 14px 14px 0;
    cursor: pointer;
    transition: background .25s;
    transform-origin: 50% 50%;
  }
  .ticket-stub:hover{ background: #fffdf8; }
  .ticket-stub::before,
  .ticket-stub::after{
    content: '';
    position: absolute;
    left: -10px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #faf6ef;
  }
  .ticket-stub::before{ top: -10px; }
  .ticket-stub::after{ bottom: -10px; }

  .stub-text{
    writing-mode: vertical-rl;
    font-size: 12px;
    letter-spacing: .4em;
    color: #b9ae9c;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity: .55; transform: translateY(0); }
    50%{ opacity: 1; transform: translateY(-3px); }
  }

  .ticket-stub.torn{ animation: tearOff .72s cubic-bezier(.45,0,.75,.5) forwards; }
  @keyframes tearOff{
    0%{ transform: rotate(0) translate(0,0); opacity: 1; }
    25%{ transform: rotate(-6deg) translate(6px, -6px); opacity: 1; }
    100%{ transform: rotate(26deg) translate(90px, 320px); opacity: 0; }
  }

  /* ================= 第二页 · 粉色流星雨 ================= */
  #p2{
    background: linear-gradient(160deg, #ffeaf1 0%, #ffd3e3 50%, #ffb9d3 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .p2-title{
    position: relative; z-index: 2;
    font-size: clamp(30px, 9vw, 46px);
    letter-spacing: .18em;
    color: #8a3355;
    opacity: 0;
    text-shadow: 0 0 28px rgba(255,255,255,.6);
  }
  #p2.active .p2-title{ animation: fadeUp 1.3s ease .35s forwards; }

  .p2-hint{
    position: absolute; bottom: 46px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; letter-spacing: .34em;
    color: rgba(138,51,85,.45);
    opacity: 0;
    z-index: 2;
  }
  #p2.active .p2-hint{ animation: fadeUp 1.2s ease 1.3s forwards; }

  .meteor{
    position: absolute;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,110,150,0) 0%, rgba(255,110,150,.85) 75%, #ff4d80 100%);
    filter: drop-shadow(0 0 6px rgba(255,120,160,.9));
    pointer-events: none;
    animation-name: meteorFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    z-index: 1;
  }
  @keyframes meteorFall{
    0%{ transform: translate(0,0) rotate(45deg); opacity: 0; }
    12%{ opacity: 1; }
    85%{ opacity: .9; }
    100%{ transform: translate(var(--dx), var(--dy)) rotate(45deg); opacity: 0; }
  }

  /* ================= 第三页 · 粉色水波纹 ================= */
  #p3{
    background: linear-gradient(160deg, #ffe8f0 0%, #ffd0e0 55%, #ffb8d0 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #rippleCanvas{ opacity: .9; }

  .p3-note{
    position: absolute; z-index: 3;
    top: 32px; left: 26px;
    font-size: 12px; line-height: 2.1;
    letter-spacing: .06em;
    color: rgba(107,44,69,.8);
  }
  .p3-note p{ margin: 0; }

  .p3-center{
    position: relative; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
  }
  .p3-center > *{ opacity: 0; }
  .p3-name{
    font-size: clamp(34px, 10vw, 46px);
    letter-spacing: .3em;
    color: #5c2238;
    text-indent: .3em;
    text-shadow: 0 0 30px rgba(255,255,255,.7);
  }
  .p3-sub{
    font-size: 12px; letter-spacing: .4em;
    color: rgba(92,34,56,.65);
    margin-bottom: 22px;
    text-indent: .4em;
  }
  #p3.active .p3-name{ animation: fadeUp 1.1s ease .45s forwards; }
  #p3.active .p3-sub{ animation: fadeUp 1.1s ease .95s forwards; }
  #p3.active .p3-btnwrap{ animation: fadeUp 1.1s ease 1.45s forwards; }

  /* ================= 第四页 · 心电图 ================= */
  #p4{
    background: #fdfaf5;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
  }
  .p4-inner{
    min-height: 100%;
    padding: 40px 26px 70px;
    display: flex; flex-direction: column; align-items: center;
  }

  .ecg-wrap{
    width: 100%;
    max-width: 460px;
    height: 62px;
    margin-bottom: 26px;
    transform-origin: 50% 50%;
  }
  .ecg{
    width: 100%; height: 100%;
    display: block;
  }
  .ecg path{
    fill: none;
    stroke: #d9705a;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .ecg-wrap.beat{ animation: beat .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes beat{
    0%{ transform: scale(1); }
    22%{ transform: scale(1.07); }
    48%{ transform: scale(.985); }
    70%{ transform: scale(1.03); }
    100%{ transform: scale(1); }
  }
  .ecg-wrap.beat .ecg path{ filter: drop-shadow(0 0 6px rgba(217,112,90,.7)); }

  .p4-name{
    font-size: clamp(30px, 8vw, 38px);
    letter-spacing: .26em;
    text-indent: .26em;
    color: #232323;
    margin-bottom: 16px;
  }
  .p4-meta{
    font-size: 11.5px;
    letter-spacing: .18em;
    color: rgba(0,0,0,.38);
    margin-bottom: 14px;
  }
  .p4-quote{
    font-size: 12.5px;
    letter-spacing: .1em;
    color: rgba(0,0,0,.4);
    text-align: center;
    line-height: 2;
    max-width: 300px;
  }

  .p4-spacer{ flex: 0 0 auto; height: 42vh; }

  .reveal{
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .reveal.in{ opacity: 1; transform: translateY(0); }

  .vertical-text{
    writing-mode: vertical-rl;
    font-size: 19px;
    letter-spacing: .42em;
    line-height: 2.2;
    color: #333;
    margin: 0 auto 60px;
  }

  .skills{
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
    letter-spacing: .16em;
    color: rgba(0,0,0,.5);
    padding: 0 4px;
    margin-bottom: 54px;
  }
  .skills .skill-val{ color: rgba(0,0,0,.72); letter-spacing: .22em; }

  /* ================= 第五页 · 个人须知 ================= */
  #p5{
    background: #faf6ef;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .p5-title{
    font-size: clamp(26px, 8vw, 34px);
    letter-spacing: .34em;
    text-indent: .34em;
    color: #2b2b2b;
    opacity: 0;
  }
  #p5.active .p5-title{ animation: fadeUp 1.1s ease .3s forwards; }

  .p5-dots{
    position: absolute; bottom: 52px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; letter-spacing: .5em;
    color: rgba(0,0,0,.22);
    opacity: 0;
  }
  #p5.active .p5-dots{ animation: fadeUp 1.2s ease 1s forwards; }

  /* ================= 第六页 · 粉色雨夜 ================= */
  #p6{
    background: linear-gradient(160deg, #ffe4ec 0%, #ffc9dd 50%, #ffb0cc 100%);
  }
  .moon{
    position: absolute;
    top: 46px; right: 42px;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 32%, #fffef8, #fff3d6 68%, #ffe0a8);
    box-shadow:
      0 0 50px 8px rgba(255,240,200,.5),
      0 0 120px 36px rgba(255,220,180,.25);
    z-index: 3;
  }
  .moon::after{
    content: '';
    position: absolute;
    top: 16px; left: 14px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(240,220,170,.45);
    box-shadow: 22px 14px 0 -3px rgba(240,220,170,.35),
                6px 30px 0 -4px rgba(240,220,170,.3);
  }

  .p6-buttons{
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap;
    padding: 0 20px;
    z-index: 4;
  }
  .p6-btn{
    font-family: inherit;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.4);
    color: #8a3355;
    font-size: 14px;
    letter-spacing: .18em;
    text-indent: .18em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background .3s, transform .3s, border-color .3s;
  }
  .p6-btn:hover{
    background: rgba(255,255,255,.7);
    border-color: rgba(255,255,255,.95);
    transform: translateY(-3px);
  }
  .p6-btn:active{ transform: translateY(0) scale(.96); }
</style>
</head>
<body>

<!-- ================= 第一页 ================= -->
<section class="page active" id="p1">
  <div class="ticket">
    <div class="ticket-body">
      <div class="t-top">ADMIT ONE</div>
      <div class="t-title song">电影票</div>
      <div class="t-line">CINEMA · 3 号厅</div>
      <div class="t-line">2024.05.20 &nbsp;19:30</div>
      <div class="t-seat">F 排 7 座</div>
    </div>
    <div class="ticket-stub" id="stub">
      <span class="stub-text">撕下</span>
    </div>
  </div>
</section>

<!-- ================= 第二页 ================= -->
<section class="page" id="p2">
  <h1 class="p2-title song">在干吗？</h1>
  <div class="p2-hint">点 击 任 意 处</div>
</section>

<!-- ================= 第三页 ================= -->
<section class="page" id="p3">
  <canvas id="rippleCanvas" class="full-canvas"></canvas>
  <div class="p3-note">
    <p>我是一个机关算尽的人</p>
    <p>但是由于数学太差</p>
    <p>全都算错了</p>
  </div>
  <div class="p3-center">
    <div class="p3-name song">名字</div>
    <div class="p3-sub">看看我</div>
    <div class="p3-btnwrap"><button class="btn" id="go4">继 续</button></div>
  </div>
</section>

<!-- ================= 第四页 ================= -->
<section class="page" id="p4">
  <div class="p4-inner">
    <div class="ecg-wrap" id="ecgWrap">
      <svg class="ecg" viewBox="0 0 400 70" preserveAspectRatio="none">
        <path d="M0 35 L40 35 L48 35 L52 27 L56 43 L60 35 L82 35
                 L88 35 L92 18 L96 52 L102 6 L108 56 L114 28 L120 35 L162 35
                 L170 35 L174 27 L178 43 L182 35 L202 35
                 L208 35 L212 18 L216 52 L222 6 L228 56 L234 28 L240 35 L282 35
                 L290 35 L294 27 L298 43 L302 35 L322 35
                 L328 35 L332 18 L336 52 L342 6 L348 56 L354 28 L360 35 L400 35"/>
      </svg>
    </div>

    <h1 class="p4-name song">名字</h1>
    <div class="p4-meta">性别 · 年龄 · MBTI · 星座</div>
    <div class="p4-quote">我们吞咽太多意义，其实生命只需要呼吸</div>

    <div class="p4-spacer"></div>

    <div class="reveal vertical-text song">生活给我一拳 可我出的是布</div>

    <div class="reveal skills">
      <span>技能</span>
      <span class="skill-val">XX&nbsp;&nbsp;XX&nbsp;&nbsp;XX</span>
    </div>

    <button class="btn" id="go5">继 续</button>
  </div>
</section>

<!-- ================= 第五页 ================= -->
<section class="page" id="p5">
  <h1 class="p5-title song">个人须知</h1>
  <div class="p5-dots">· · ·</div>
</section>

<!-- ================= 第六页 ================= -->
<section class="page" id="p6">
  <canvas id="rainCanvas" class="full-canvas"></canvas>
  <div class="moon"></div>
  <div class="p6-buttons">
    <button class="p6-btn">话术</button>
    <button class="p6-btn">板评</button>
    <button class="p6-btn">卡面</button>
  </div>
</section>

<script>
/* ============ 页面切换 ============ */
let currentPage = 'p1';

function goTo(id){
  const from = document.querySelector('.page.active');
  if (from) from.classList.remove('active');
  const to = document.getElementById(id);
  if (!to) return;
  to.classList.add('active');
  if (id === 'p4') to.scrollTop = 0;
  currentPage = id;
  if (id === 'p2') startMeteors(); else stopMeteors();
  if (id === 'p3') initRipples();
  if (id === 'p6') initRain();
}

/* ============ 第一页：撕票根 ============ */
const stub = document.getElementById('stub');
stub.addEventListener('click', function(){
  if (this.classList.contains('torn')) return;
  this.classList.add('torn');
  setTimeout(() => goTo('p2'), 640);
});

/* ============ 第二页：流星雨 ============ */
let meteorTimer = null;

function spawnMeteor(){
  const p2 = document.getElementById('p2');
  if (!p2) return;
  const el = document.createElement('div');
  el.className = 'meteor';
  const dist = 26 + Math.random() * 42;
  el.style.left = (Math.random() * 76 - 6) + 'vw';
  el.style.top  = (Math.random() * 42 - 16) + 'vh';
  el.style.width = (70 + Math.random() * 90) + 'px';
  el.style.setProperty('--dx', dist + 'vh');
  el.style.setProperty('--dy', dist + 'vh');
  el.style.animationDuration = (1.1 + Math.random() * 1.3) + 's';
  p2.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
function startMeteors(){
  if (meteorTimer) return;
  spawnMeteor();
  meteorTimer = setInterval(spawnMeteor, 420);
}
function stopMeteors(){
  if (meteorTimer){ clearInterval(meteorTimer); meteorTimer = null; }
}

document.getElementById('p2').addEventListener('click', () => {
  if (currentPage === 'p2') goTo('p3');
});

/* ============ 第三页：水波纹 ============ */
let rippleCanvas = null, rctx = null, ripples = [], rippleReady = false;

function initRipples(){
  if (rippleReady) return;
  rippleReady = true;
  rippleCanvas = document.getElementById('rippleCanvas');
  rctx = rippleCanvas.getContext('2d');
  resizeRipples();
  window.addEventListener('resize', resizeRipples);
  for (let i = 0; i < 6; i++) spawnRipple(true);
}
function resizeRipples(){
  if (!rippleCanvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  rippleCanvas.width  = window.innerWidth  * dpr;
  rippleCanvas.height = window.innerHeight * dpr;
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function spawnRipple(spread){
  ripples.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: spread ? Math.random() * 90 : 0,
    max: 130 + Math.random() * 200,
    a: 1,
    speed: 0.55 + Math.random() * 0.9
  });
}
function drawRipples(){
  if (!rctx) return;
  const w = window.innerWidth, h = window.innerHeight;
  rctx.clearRect(0, 0, w, h);

  if (Math.random() < 0.035) spawnRipple(false);

  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i];
    rp.r += rp.speed;
    rp.a = 1 - rp.r / rp.max;
    if (rp.a <= 0){ ripples.splice(i, 1); continue; }

    rctx.beginPath();
    rctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    rctx.strokeStyle = 'rgba(255,255,255,' + (rp.a * 0.45) + ')';
    rctx.lineWidth = 1.1;
    rctx.stroke();

    const r2 = rp.r * 0.72;
    if (r2 > 5){
      rctx.beginPath();
      rctx.arc(rp.x, rp.y, r2, 0, Math.PI * 2);
      rctx.strokeStyle = 'rgba(255,255,255,' + (rp.a * 0.22) + ')';
      rctx.lineWidth = 1;
      rctx.stroke();
    }
  }
}

/* ============ 第四页：心电图 & 渐显 ============ */
const p4 = document.getElementById('p4');
const ecgWrap = document.getElementById('ecgWrap');

p4.addEventListener('click', (e) => {
  if (e.target.closest('button')) return;
  ecgWrap.classList.remove('beat');
  void ecgWrap.offsetWidth;
  ecgWrap.classList.add('beat');
});
ecgWrap.addEventListener('animationend', () => ecgWrap.classList.remove('beat'));

const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if (en.isIntersecting) en.target.classList.add('in');
  });
}, { root: p4, threshold: 0.25 });

p4.querySelectorAll('.reveal').forEach(el => io.observe(el));

document.getElementById('go4').addEventListener('click', (e) => {
  e.stopPropagation();
  goTo('p4');
});
document.getElementById('go5').addEventListener('click', (e) => {
  e.stopPropagation();
  goTo('p5');
});

/* ============ 第五页：点击任意处 ============ */
document.getElementById('p5').addEventListener('click', () => {
  if (currentPage === 'p5') goTo('p6');
});

/* ============ 第六页：下雨 ============ */
let rainCanvas = null, rainctx = null, drops = [], rainReady = false;

function initRain(){
  if (rainReady) return;
  rainReady = true;
  rainCanvas = document.getElementById('rainCanvas');
  rainctx = rainCanvas.getContext('2d');
  resizeRain();
  drops = [];
  for (let i = 0; i < 170; i++) drops.push(makeDrop(true));
  window.addEventListener('resize', resizeRain);
}
function resizeRain(){
  if (!rainCanvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  rainCanvas.width  = window.innerWidth  * dpr;
  rainCanvas.height = window.innerHeight * dpr;
  rainctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function makeDrop(randomY){
  return {
    x: Math.random() * window.innerWidth,
    y: randomY ? Math.random() * window.innerHeight : -30,
    len: 9 + Math.random() * 20,
    sp: 5.5 + Math.random() * 8,
    a: 0.12 + Math.random() * 0.32,
    w: 0.6 + Math.random() * 0.9
  };
}
function drawRain(){
  if (!rainctx) return;
  const w = window.innerWidth, h = window.innerHeight;
  rainctx.clearRect(0, 0, w, h);
  rainctx.lineCap = 'round';

  for (const d of drops){
    rainctx.beginPath();
    rainctx.moveTo(d.x, d.y);
    rainctx.lineTo(d.x - 1.6, d.y + d.len);
    rainctx.strokeStyle = 'rgba(255,255,255,' + d.a + ')';
    rainctx.lineWidth = d.w;
    rainctx.stroke();

    d.y += d.sp;
    d.x -= 0.45;

    if (d.y > h + 40 || d.x < -40){
      d.y = -40;
      d.x = Math.random() * (w + 80);
    }
  }
}

/* ============ 主循环 ============ */
function loop(){
  requestAnimationFrame(loop);
  if (currentPage === 'p3') drawRipples();
  if (currentPage === 'p6') drawRain();
}
requestAnimationFrame(loop);
</script>
